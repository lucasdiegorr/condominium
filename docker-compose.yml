services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cond_pass}
      POSTGRES_DB: ${POSTGRES_DB:-condominium}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cond} -d ${POSTGRES_DB:-condominium}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prebuilt images published to GHCR by .github/workflows/publish.yml.
  # Building images inside an Agent-managed (remote) Portainer environment is
  # not supported (BuildKit gRPC is not relayed) — compose deploys by pull.
  backend:
    image: ghcr.io/lucasdiegorr/condominium-backend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      # Derive DATABASE_URL from POSTGRES_* so credentials stay in sync when
      # the stack env overrides the DB user/password/name. An explicit
      # DATABASE_URL in the stack env still wins.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-cond}:${POSTGRES_PASSWORD:-cond_pass}@postgres:5432/${POSTGRES_DB:-condominium}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      IDENTITY_TOKEN_TTL_MINUTES: ${IDENTITY_TOKEN_TTL_MINUTES:-60}
      SCOPED_TOKEN_TTL_MINUTES: ${SCOPED_TOKEN_TTL_MINUTES:-20}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/lucasdiegorr/condominium-frontend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
